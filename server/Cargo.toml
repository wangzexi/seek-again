[package]
name = "deepseek-chat-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli", "deflate"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }

url = "2"

[dev-dependencies]
futures-util = "0.3"
